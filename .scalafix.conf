rules = [
  OrganizeImports,
  RemoveUnused,
  DisableSyntax,
]

OrganizeImports {
  preset = DEFAULT
  removeUnused = true
}

RemoveUnused {
  imports = false
  privates = true
  locals = true
  patternvars = true
  params = false
}

DisableSyntax {
  noVars = true
  noNulls = true
  noReturns = true
  noWhileLoops = true
  noThrows = true
  noAsInstanceOf = true
  noIsInstanceOf = true
}
