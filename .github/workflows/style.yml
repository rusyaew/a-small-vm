name: style-and-test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: style-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-project:
    runs-on: ubuntu-latest
    outputs:
      has_sbt: ${{ steps.detect.outputs.has_sbt }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Detect sbt project
        run: |
          if [ -f build.sbt ]; then
            echo "has_sbt=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sbt=false" >> "$GITHUB_OUTPUT"
          fi

  style:
    needs: detect-project
    if: ${{ needs.detect-project.outputs.has_sbt == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - name: Check formatting and lint
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck compile Test/compile "scalafixAll --check"

  test:
    needs: detect-project
    if: ${{ needs.detect-project.outputs.has_sbt == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - name: Run tests
        run: sbt -batch test
